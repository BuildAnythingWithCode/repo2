# Rebuilds the public website every day and publishes it with GitHub Pages.
#
# Each run takes a fresh copy of the repository, downloads all the data again, re-runs the model
# and the backtest (scripts/refresh.py), builds the site (scripts/build_site.py) and pushes it to
# the gh-pages branch, which GitHub Pages serves. If any step fails, nothing is published and the
# site keeps the previous day's numbers. Pull requests build the site but never publish it.

name: Website

on:
  schedule:
    - cron: "17 5 * * *"    # 05:17 UTC (1:17 PM in UTC+8), a few hours after the daily close
    - cron: "17 17 * * *"   # a second try twelve hours later, in case the first one failed
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # push the built site to the gh-pages branch
  actions: write    # keep the daily schedule switched on (GitHub pauses schedules after 60 quiet days)

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-site.txt

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-site.txt

      - name: Download, score, backtest and export
        run: python3 -I scripts/refresh.py

      - name: Build the website
        run: python3 -I scripts/build_site.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to the gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day=$(python3 -I -c 'import json; print(json.load(open("_site/data/today.json"))["rows"][0]["date"])')
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website for data through ${day}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published the website for data through ${day}." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the daily schedule switched on
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/website.yml/enable"

      - name: Keep a copy of the built site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: _site
          retention-days: 7
